AutoName: SkyFox

Summary: Fast, privacy-friendly ADS-B flight tracker. No account required.

Description: |-
  SkyFox is an independent, open-source ADS-B flight tracker for Android.
  Track live aircraft on an interactive map, search by HEX code, callsign,
  registration, or SQUAWK, build watchlists, and inspect full plane details
  including operator, route, and emergency squawk alerts.

  No account. No tracking. No ads.

  SkyFox is based on the airplanes.live Android app by d4rken
  (https://github.com/d4rken-org/airplanes-live-app), used under GPL-3.0.
  It uses airplanes.live data and is not affiliated with or endorsed by
  airplanes.live.

  Source code: https://github.com/taynotfound/skyfox

