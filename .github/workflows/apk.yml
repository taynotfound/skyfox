name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # ponytail: debug build = auto-signed with debug key, installable, no keystore secrets needed.
      # Switch to assembleFossRelease + signing secrets when this goes public.
      - name: Build FOSS debug APK
        run: ./gradlew assembleFossDebug

      - uses: actions/upload-artifact@v4
        with:
          name: skyfox-apk
          path: app/build/outputs/apk/foss/debug/*.apk

      # rolling "nightly" prerelease — always points at latest main build
      - name: Update nightly release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/foss/debug/*.apk | head -1)
          cp "$APK" skyfox-nightly.apk
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly skyfox-nightly.apk --prerelease \
            --title "SkyFox Nightly" \
            --notes "Automated nightly build from \`main\` (${GITHUB_SHA::7}). May be unstable."

      # Send a compact run log to Discord when DISCORD_WEBHOOK_URL is configured.
      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          RUN_STATUS: ${{ job.status }}
        run: |
          if [[ -z "${DISCORD_WEBHOOK_URL}" ]]; then
            echo "DISCORD_WEBHOOK_URL is not configured; skipping Discord notification."
            exit 0
          fi
          python3 - <<'PY' > /tmp/discord-payload.json
          import json, os
          event = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          commit = event.get("head_commit") or {}
          message = (commit.get("message") or "").splitlines()[0]
          status = os.environ["RUN_STATUS"]
          sha = os.environ["GITHUB_SHA"][:7]
          repo = os.environ["GITHUB_REPOSITORY"]
          commit_url = commit.get("url") or f"https://github.com/{repo}/commit/{os.environ['GITHUB_SHA']}"
          run_url = f"https://github.com/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          content = "\n".join([
              f"**SkyFox nightly APK: {status}**",
              f"Commit: [`{sha}`]({commit_url})",
              f"Message: {message or '(no commit message)'}",
              f"[GitHub Actions run]({run_url})",
          ])
          json.dump({"content": content}, open("/tmp/discord-payload.json", "w"))
          PY
          curl --silent --show-error \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/discord-payload.json \
            "${DISCORD_WEBHOOK_URL}" || echo "Discord notification failed; continuing without blocking CI."
