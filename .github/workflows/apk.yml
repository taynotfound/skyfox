name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # ponytail: debug build = auto-signed with debug key, installable, no keystore secrets needed.
      # Switch to assembleFossRelease + signing secrets when this goes public.
      - name: Build FOSS debug APK
        run: ./gradlew assembleFossDebug

      - uses: actions/upload-artifact@v4
        with:
          name: prettier-airplanes-live-apk
          path: app/build/outputs/apk/foss/debug/*.apk
