name: Discord repository logs

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed, ready_for_review]
  issues:
    types: [opened, reopened, closed]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [Build APK]
    types: [completed]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send event to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          if [[ -z "${DISCORD_WEBHOOK_URL}" ]]; then
            echo "DISCORD_WEBHOOK_URL is not configured; skipping Discord notification."
            exit 0
          fi
          python3 - <<'PY' > /tmp/discord-payload.json
          import json, os
          event = os.environ["EVENT_NAME"]
          action = os.environ.get("EVENT_ACTION") or ""
          actor = os.environ["ACTOR"]
          repo = os.environ["REPOSITORY"]
          sha = os.environ["SHA"][:7]
          run_url = f"https://github.com/{repo}/actions/runs/{os.environ['RUN_ID']}"
          if event == "workflow_run":
              name = os.environ.get("WORKFLOW_NAME") or "workflow"
              conclusion = os.environ.get("WORKFLOW_CONCLUSION") or "unknown"
              text = f"{name}: **{conclusion}** · `{sha}` · [run]({run_url}) · @{actor}"
          else:
              text = f"{event}{(': ' + action) if action else ''} · `{sha}` · [run]({run_url}) · @{actor}"
          json.dump({"content": text}, open("/tmp/discord-payload.json", "w"))
          PY
          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/discord-payload.json \
            "${DISCORD_WEBHOOK_URL}"
