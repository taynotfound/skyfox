name: Discord repository logs

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed, ready_for_review]
  issues:
    types: [opened, reopened, closed]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [Build APK]
    types: [completed]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send event to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          if [[ -z "${DISCORD_WEBHOOK_URL}" ]]; then
            echo "DISCORD_WEBHOOK_URL is not configured; skipping Discord notification."
            exit 0
          fi
          python3 - <<'PY' > /tmp/discord-payload.json
          import json, os
          event = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          kind = os.environ["GITHUB_EVENT_NAME"]
          action = event.get("action", "")
          repo = os.environ["GITHUB_REPOSITORY"]
          actor = os.environ["GITHUB_ACTOR"]
          sha = os.environ["GITHUB_SHA"][:7]
          run_url = f"https://github.com/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          lines = [f"**{kind}{(': ' + action) if action else ''}**", f"Repository: `{repo}`", f"Actor: @{actor}"]
          if kind == "push":
              commit = event.get("head_commit") or {}
              message = (commit.get("message") or "").splitlines()[0]
              commit_url = commit.get("url") or f"https://github.com/{repo}/commit/{os.environ['GITHUB_SHA']}"
              lines += [f"Commit: [`{sha}`](<{commit_url}>)", f"Message: {message or '(no commit message)'}"]
          elif kind == "pull_request":
              pr = event.get("pull_request") or {}
              lines += [f"PR #{pr.get('number', event.get('number', '?'))}: [{pr.get('title', '(untitled)')}](<{pr.get('html_url', '')}>)"]
          elif kind == "issues":
              issue = event.get("issue") or {}
              lines += [f"Issue #{issue.get('number', '?')}: {issue.get('title', '(untitled)')} (<{issue.get('html_url', '')}>)"]
          elif kind == "issue_comment":
              issue = event.get("issue") or {}
              body = (event.get("comment") or {}).get("body", "").replace("\n", " ")[:300]
              lines += [f"Issue #{issue.get('number', '?')}: {issue.get('title', '(untitled)')} (<{issue.get('html_url', '')}>)", f"Comment: {body}"]
          elif kind == "workflow_run":
              workflow = event.get("workflow_run") or {}
              commit = workflow.get("head_commit") or {}
              message = (commit.get("message") or "").splitlines()[0]
              lines += [f"Workflow: `{workflow.get('name', '(unnamed)')}` → **{workflow.get('conclusion', 'unknown')}**", f"Commit: `{(workflow.get('head_sha') or sha)[:7]}`", f"Message: {message or '(no commit message)'}"]
          lines.append(f"GitHub Actions run: <{run_url}>")
          json.dump({"content": "\n".join(lines)}, open("/tmp/discord-payload.json", "w"))
          PY
          curl --silent --show-error \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/discord-payload.json \
            "${DISCORD_WEBHOOK_URL}" || echo "Discord notification failed; continuing without blocking CI."
