name: Generate current app screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/src/**'
      - 'app/build.gradle.kts'
      - 'commonMain/**'

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate current FOSS screenshots
        run: ./gradlew :app:updateFossDebugScreenshotTest --no-configuration-cache

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: skyfox-current-screenshots
          path: app/src/screenshotTestFossDebug/reference/**/*.png
          if-no-files-found: error
