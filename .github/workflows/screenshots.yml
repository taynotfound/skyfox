name: Generate current app screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/src/**'
      - 'app/build.gradle.kts'

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate current FOSS screenshots
        run: ./gradlew :app:validateFossDebugScreenshotTest --rerun

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: skyfox-current-screenshots
          path: app/build/outputs/screenshotTest/
          retention-days: 7

      - name: Push screenshots to website repo
        env:
          WEBSITE_DEPLOY_KEY: ${{ secrets.WEBSITE_DEPLOY_KEY }}
        run: |
          if [[ -z "${WEBSITE_DEPLOY_KEY}" ]]; then
            echo "WEBSITE_DEPLOY_KEY not set; skipping website push."
            exit 0
          fi

          python3 - <<'PY'
          import shutil, subprocess, os
          from pathlib import Path

          SRC = Path("app/build/outputs/screenshotTest/fossDebug/record/de/taymaerz/skyfox/screenshots/PlayStoreScreenshotsKt")
          SCREEN_MAP = {"Map": "map", "Search": "search", "Watch": "watch", "PlaneDetails": "plane-details"}
          LOCALE_MAP = {"de-DE": "de", "en-US": "en", "es-ES": "es", "fr-FR": "fr", "it-IT": "it"}

          out = Path("/tmp/website-screenshots")
          for png in SRC.glob("*.png"):
              stem = png.stem
              idx = stem.index("_")
              func = stem[:idx]
              locale_raw = stem[idx+1:].split("_")[0]
              screen = SCREEN_MAP.get(func)
              locale_dir = LOCALE_MAP.get(locale_raw)
              if screen and locale_dir:
                  dest = out / locale_dir / f"{screen}.png"
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(png, dest)
                  print(f"  {png.name} -> {locale_dir}/{screen}.png")
          PY

          # Clone website repo with deploy key
          mkdir -p ~/.ssh
          echo "${WEBSITE_DEPLOY_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"

          git clone git@github.com:taynotfound/skyfox-website.git /tmp/skyfox-website
          cp -r /tmp/website-screenshots/. /tmp/skyfox-website/assets/screenshots/

          cd /tmp/skyfox-website
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/screenshots/
          if git diff --cached --quiet; then
            echo "Screenshots unchanged; nothing to commit."
          else
            COMMIT=$(echo "${{ github.sha }}" | cut -c1-7)
            git commit -m "auto: refresh screenshots from app commit ${COMMIT}"
            git push
            echo "Pushed updated screenshots to website repo."
          fi
